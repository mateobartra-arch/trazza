<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trazza · Portal (vista)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   TRAZZA — PORTAL (pantalla principal)
   --------------------------------------------------------------------------
   Esta es la pantalla que faltaba. Una pantalla suelta no es un producto:
   el orden real es INGRESO -> PORTAL -> MÓDULO, y el portal es el único
   lugar donde una persona ve de qué es dueña. Sin él, cada módulo es un
   enlace que alguien tiene que recordar.

   POR QUÉ NO ES UN MENÚ LATERAL LLENO
   El sistema de origen pone los 30 módulos en una columna izquierda siempre
   abierta. Funciona para quien ya sabe dónde está todo, y castiga a quien
   no: la primera pantalla del producto es una lista de treinta cosas. Aquí
   la navegación tiene tres capas y cada una sirve a alguien distinto:
     · el riel de la izquierda (72px) da SALTO entre grupos, no entre
       módulos — se expande al pasar el mouse y no ocupa pantalla;
     · la rejilla de tarjetas da DESCUBRIMIENTO: qué existe y en qué estado;
     · el buscador (tecla / o Ctrl-K) da VELOCIDAD para quien ya sabe.
   El operador que entra 40 veces al día usa la tercera y no vuelve a mirar
   las otras dos.

   EL CATÁLOGO NO SE ESCRIBE AQUÍ
   Ni un solo módulo está escrito a mano en este archivo. Todo sale de
   TRAZZA.catalogo.modulos(), que ya filtró por lo que el cliente contrató
   y por lo que la persona puede ver. Agregar un módulo a un tenant es una
   línea en su trazza.config.js; esta pantalla no se toca.
   ========================================================================== */
:root{
  --basalt:#12161C; --basalt2:#1B2129; --basalt3:#2B3441; --basalt4:#3E4956;
  --niebla:#EBEFF3; --papel:#FFFFFF;
  --cobre:#C0703A; --cardenillo:#12897A; --ambar:#B8820F; --ocre:#A93529;
  --tinta:#151A20; --tinta2:#59636F; --tinta3:#8B95A1; --linea:#D9DFE6;
  --r:14px; --r2:8px;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Archivo","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sombra:0 1px 2px rgba(18,22,28,.06),0 8px 24px -12px rgba(18,22,28,.18);
  --sombra2:0 24px 64px -24px rgba(18,22,28,.45);
  --riel:72px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--niebla);color:var(--tinta);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
.hidden{display:none !important}
:focus-visible{outline:2px solid rgba(192,112,58,.55);outline-offset:2px;border-radius:6px}

/* ---------- riel lateral ---------- */
.riel{position:fixed;top:0;left:0;bottom:0;width:var(--riel);background:var(--basalt);z-index:60;
  display:flex;flex-direction:column;transition:width .18s ease;overflow:hidden;border-right:1px solid #0B0E12}
.riel:hover,.riel.abierto{width:252px;box-shadow:var(--sombra2)}
.riel .marca{display:flex;align-items:center;gap:11px;height:64px;padding:0 18px;flex:0 0 auto;border-bottom:1px solid rgba(255,255,255,.07)}
.riel .glifo{width:34px;height:34px;flex:0 0 34px;border-radius:9px;background:var(--cobre);color:#fff;
  display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:-.02em}
.riel .nom{font-family:var(--disp);font-weight:600;font-size:16.5px;color:#fff;letter-spacing:-.01em;white-space:nowrap;opacity:0;transition:opacity .14s}
.riel .nom small{display:block;font-family:var(--sans);font-weight:500;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--tinta3);margin-top:1px}
.riel:hover .nom,.riel.abierto .nom{opacity:1}
.rlista{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:10px 0 14px}
.rlista::-webkit-scrollbar{width:0}
.ritem{display:flex;align-items:center;gap:14px;height:44px;padding:0 20px;color:#AEB7C2;cursor:pointer;white-space:nowrap;border-left:3px solid transparent}
.ritem:hover{background:rgba(255,255,255,.055);color:#fff}
.ritem.on{color:#fff;border-left-color:var(--cobre);background:rgba(192,112,58,.11)}
.ritem .ico{width:22px;flex:0 0 22px;text-align:center;font-size:16px;line-height:1}
.ritem .txt{font-size:14px;opacity:0;transition:opacity .14s}
.ritem .cnt{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--tinta3);opacity:0;transition:opacity .14s}
.riel:hover .txt,.riel:hover .cnt,.riel.abierto .txt,.riel.abierto .cnt{opacity:1}
.rsep{height:1px;background:rgba(255,255,255,.07);margin:10px 20px}
.rpie{flex:0 0 auto;border-top:1px solid rgba(255,255,255,.07);padding:12px 16px;display:flex;align-items:center;gap:11px}
.rpie .av{width:34px;height:34px;flex:0 0 34px;border-radius:50%;background:var(--basalt3);color:#fff;display:grid;place-items:center;
  font-family:var(--disp);font-weight:600;font-size:13px}
.rpie .quien{min-width:0;opacity:0;transition:opacity .14s}
.riel:hover .quien,.riel.abierto .quien{opacity:1}
.rpie .quien b{display:block;font-size:13.5px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.rpie .quien span{font-size:11.5px;color:var(--tinta3)}
.rpie .salir{margin-left:auto;background:none;border:0;color:var(--tinta3);cursor:pointer;font-size:16px;padding:6px;opacity:0;transition:opacity .14s}
.riel:hover .salir,.riel.abierto .salir{opacity:1}
.rpie .salir:hover{color:#fff}

/* ---------- estructura ---------- */
.marco{margin-left:var(--riel);min-height:100vh;display:flex;flex-direction:column}
.barra{position:sticky;top:0;z-index:40;height:64px;background:rgba(235,239,243,.86);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:16px;padding:0 30px}
.miga{font-size:14px;color:var(--tinta2);font-weight:500}
.buscar{margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--papel);border:1px solid var(--linea);
  border-radius:999px;padding:8px 15px;min-width:300px;cursor:text;color:var(--tinta3);font-size:14px;transition:border-color .12s,box-shadow .12s}
.buscar:hover{border-color:#C6CFD9;box-shadow:var(--sombra)}
.buscar kbd{margin-left:auto;font-family:var(--mono);font-size:10.5px;background:var(--niebla);border:1px solid var(--linea);
  border-radius:5px;padding:2px 6px;color:var(--tinta2)}
.env{flex:1 1 auto;padding:26px 30px 60px;max-width:1440px;width:100%;margin:0 auto}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:var(--r);background:var(--basalt);color:#fff;padding:30px 34px;
  display:flex;align-items:flex-start;gap:24px;box-shadow:var(--sombra)}
.hero::after{content:"";position:absolute;right:-90px;top:-120px;width:420px;height:420px;border-radius:50%;
  background:radial-gradient(circle,rgba(192,112,58,.30),rgba(192,112,58,0) 68%)}
.hero .txt{position:relative;z-index:1;min-width:0}
.hero .et{font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--cobre);font-weight:600}
.hero h1{margin:8px 0 6px;font-family:var(--disp);font-size:31px;font-weight:600;letter-spacing:-.025em;line-height:1.12}
.hero p{margin:0;color:#AEB7C2;font-size:14.5px;max-width:56ch}
.hero .reloj{position:relative;z-index:1;margin-left:auto;text-align:right;flex:0 0 auto}
.hero .reloj b{display:block;font-family:var(--disp);font-size:26px;font-weight:600;letter-spacing:-.02em}
.hero .reloj span{font-size:12.5px;color:var(--tinta3)}

/* ---------- pulso (estado operativo) ---------- */
.pulso{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:14px;margin-top:16px}
.kpi{background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sombra);
  display:flex;flex-direction:column;gap:3px;transition:transform .12s,box-shadow .12s;cursor:pointer}
.kpi:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(18,22,28,.07),0 14px 30px -14px rgba(18,22,28,.28)}
.kpi .n{font-family:var(--disp);font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.05}
.kpi .l{font-size:13px;color:var(--tinta2)}
.kpi .p{font-size:11.5px;color:var(--tinta3);margin-top:5px}
.kpi.alerta{background:#FAEDEA;border-color:#EBCFC9}
.kpi.alerta .n{color:var(--ocre)}
.kpi.bien{background:#DCF0ED;border-color:#B9DED8}
.kpi.bien .n{color:#0D6B5F}
.kpi.tibio{background:#FAF1D9;border-color:#E9DBAE}
.kpi.tibio .n{color:#8A6208}

/* ---------- grupos de módulos ---------- */
.grupo{margin-top:34px}
.gtit{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.gtit .gi{width:30px;height:30px;border-radius:9px;background:var(--basalt);color:#fff;display:grid;place-items:center;font-size:14px}
.gtit h2{margin:0;font-family:var(--disp);font-size:18px;font-weight:600;letter-spacing:-.02em}
.gtit .n{font-size:11.5px;color:var(--tinta2);background:var(--papel);border:1px solid var(--linea);border-radius:999px;padding:2px 10px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
.mod{position:relative;background:var(--papel);border:1px solid var(--linea);border-radius:var(--r);padding:18px;
  box-shadow:var(--sombra);display:flex;flex-direction:column;min-height:150px;cursor:pointer;
  transition:transform .12s,box-shadow .12s,border-color .12s}
.mod:hover{transform:translateY(-3px);border-color:#C6CFD9;box-shadow:0 2px 4px rgba(18,22,28,.07),0 18px 38px -16px rgba(18,22,28,.32)}
.mod .mi{width:34px;height:34px;border-radius:9px;background:var(--niebla);display:grid;place-items:center;font-size:16px;margin-bottom:12px}
.mod h3{margin:0 0 5px;font-family:var(--disp);font-size:16px;font-weight:600;letter-spacing:-.015em}
.mod p{margin:0;font-size:13.2px;color:var(--tinta2);line-height:1.45}
.mod .ir{margin-top:auto;padding-top:13px;font-size:13px;font-weight:600;color:var(--cobre);display:flex;align-items:center;gap:5px}
.mod .ir i{font-style:normal;transition:transform .14s}
.mod:hover .ir i{transform:translateX(3px)}
.mod .sello{position:absolute;top:14px;right:14px;font-family:var(--mono);font-size:10.5px;font-weight:500;
  border-radius:999px;padding:3px 9px;background:#F6ECE3;color:var(--cobre)}
.mod .sello.rojo{background:#FAEDEA;color:var(--ocre)}
.mod .sello.verde{background:#DCF0ED;color:#0D6B5F}
.mod.pronto{cursor:default;background:transparent;border-style:dashed;box-shadow:none}
.mod.pronto:hover{transform:none;box-shadow:none;border-color:var(--linea)}
.mod.pronto .mi{background:transparent;border:1px dashed var(--linea)}
.mod.pronto h3,.mod.pronto p{color:var(--tinta3)}
.mod.pronto .ir{color:var(--tinta3)}
/* Chips de rubro: una tarjeta que representa a varios módulos hermanos.
   Punto 4 del changelog — el usuario percibe UN módulo con pestañas; el
   código sigue siendo una página por hermano. */
.mod .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mod .chips span{font-family:var(--mono);font-size:10.5px;color:var(--tinta2);
  border:1px solid var(--linea);border-radius:999px;padding:2px 8px;background:var(--niebla)}

/* ---------- paleta de comandos ---------- */
.velo{position:fixed;inset:0;background:rgba(18,22,28,.52);backdrop-filter:blur(3px);z-index:90;display:grid;place-items:start center;padding-top:11vh}
.paleta{width:min(620px,92vw);background:var(--papel);border-radius:var(--r);box-shadow:var(--sombra2);overflow:hidden}
.paleta .campo{display:flex;align-items:center;gap:11px;padding:16px 20px;border-bottom:1px solid var(--linea)}
.paleta .campo span{color:var(--tinta3);font-size:17px}
.paleta input{flex:1;border:0;outline:0;font:inherit;font-size:16.5px;background:none;color:var(--tinta)}
.paleta input::placeholder{color:var(--tinta3)}
.pres{max-height:min(420px,56vh);overflow-y:auto;padding:6px}
.pres .it{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:var(--r2);cursor:pointer}
.pres .it.sel{background:var(--niebla)}
.pres .it .ii{width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:var(--niebla);display:grid;place-items:center;font-size:14px}
.pres .it.sel .ii{background:var(--papel)}
.pres .it b{font-weight:600;font-size:14.5px}
.pres .it small{display:block;color:var(--tinta2);font-size:12.5px;font-weight:400}
.pres .it .ar{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--tinta3)}
.pres .nada{padding:26px;text-align:center;color:var(--tinta3);font-size:14px}
.paleta .pie{border-top:1px solid var(--linea);padding:9px 20px;font-size:11.5px;color:var(--tinta3);display:flex;gap:16px}
.paleta .pie kbd{font-family:var(--mono);background:var(--niebla);border:1px solid var(--linea);border-radius:4px;padding:1px 5px;font-size:10.5px}

/* ---------- estados ---------- */
.cargando{padding:80px 0;text-align:center;color:var(--tinta3);font-size:14.5px}
.aviso{background:#FAEDEA;border:1px solid #EBCFC9;color:#7A2820;border-radius:var(--r);padding:14px 18px;font-size:14px;margin-top:16px}

.menu{display:none;place-items:center;width:38px;height:38px;border:1px solid var(--linea);background:var(--papel);border-radius:var(--r2);cursor:pointer}
@media(max-width:820px){
  :root{--riel:0px}
  .riel{transform:translateX(-100%);width:252px}
  .riel.abierto{transform:none}
  .marco{margin-left:0}
  .barra{padding:0 16px}
  .buscar{min-width:0;flex:1}
  .buscar .lbl,.buscar kbd{display:none}
  .env{padding:18px 16px 50px}
  .hero{flex-direction:column;padding:24px 22px}
  .hero .reloj{margin-left:0;text-align:left}
  .hero h1{font-size:25px}
  .menu{display:grid}
}
</style>
</head>
<body>

<aside class="riel" id="riel">
  <div class="marca">
    <div class="glifo">T</div>
    <div class="nom">Trazza<small id="rz">Portal</small></div>
  </div>
  <div class="rlista" id="rlista"></div>
  <div class="rpie">
    <div class="av" id="av">·</div>
    <div class="quien"><b id="qn">—</b><span id="qr">—</span></div>
    <button class="salir" id="salir" title="Cerrar sesión">⏻</button>
  </div>
</aside>

<div class="marco">
  <div class="barra">
    <button class="menu" id="menu" aria-label="Menú">☰</button>
    <div class="miga">Inicio</div>
    <div class="buscar" id="abrirBuscar" role="button" tabindex="0">
      <span>⌕</span><span class="lbl">Buscar módulo…</span><kbd>Ctrl K</kbd>
    </div>
  </div>

  <main class="env">
    <div id="cargando" class="cargando">Cargando tu portal…</div>
    <div id="portal" class="hidden">
      <section class="hero">
        <div class="txt">
          <div class="et" id="etiqueta">Portal de gestión</div>
          <h1 id="saludo">Hola</h1>
          <p id="bajada">Este es tu centro de operaciones.</p>
        </div>
        <div class="reloj"><b id="hora">—</b><span id="fecha">—</span></div>
      </section>
      <section class="pulso" id="pulso"></section>
      <div id="grupos"></div>
    </div>
  </main>
</div>

<div class="velo hidden" id="velo">
  <div class="paleta">
    <div class="campo"><span>⌕</span><input id="q" placeholder="Buscar módulo, gasto, unidad…" autocomplete="off" spellcheck="false"></div>
    <div class="pres" id="pres"></div>
    <div class="pie"><span><kbd>↑</kbd><kbd>↓</kbd> moverse</span><span><kbd>Enter</kbd> abrir</span><span><kbd>Esc</kbd> cerrar</span></div>
  </div>
</div>


<!-- Orden de carga del núcleo (ver trazza-init.js): config → init → normaliza
     → params → db → utilidad → catalogo → auth. Alterarlo produce la peor
     falla que existe: una pantalla que arranca y muere según el orden de
     los <script>. -->
<script src="../public/core/trazza.config.js"></script>
<script>
/* ==========================================================================
   HARNESS DE VISTA — datos FICTICIOS, no toca Firebase.
   --------------------------------------------------------------------------
   Sustituye init/db/auth por objetos con la MISMA firma. El catálogo NO se
   sustituye: se carga el archivo real, para que esta vista pruebe el filtrado
   de verdad (contrato + permisos) y no una lista escrita a mano.
   Las urls de los módulos se reescriben a las pantallas que existen en esta
   maqueta; un módulo todavía sin portar cae en vista-pendiente.html en vez de
   dar 404, que es lo honesto: existe en el catálogo, aún no en el código.
   ========================================================================== */
(function(g){
  var P = function(v){ return Promise.resolve(v); };
  var CFG = g.TRAZZA_CONFIG || {};
  var HECHOS = { viajes:"vista-viajes.html" };
  (CFG.modulos||[]).forEach(function(m){
    if(m && m.estado !== "oculto"){
      m.url = HECHOS[m.id] || ("vista-pendiente.html?m="+encodeURIComponent(m.id)+"&t="+encodeURIComponent(m.label||m.id));
    }
  });
  g.TRAZZA = g.TRAZZA || {};
  g.TRAZZA.ROOT = "";
  g.TRAZZA.esAdmin  = function(){ return true; };
  g.TRAZZA.puedeVer = function(){ return true; };
  g.TRAZZA.logout   = function(){ location.href = "vista-ingreso.html"; };
  g.TRAZZA.requireLogin = function(){
    return P({ user:{uid:"demo", email:"mateo@trazza.app"},
               perfil:{nombre:"Mateo Bartra", areas:["admin"], activo:true} });
  };
    /* Los mismos 7 tramos que muestra vista-viajes.html, para que el portal y el
     módulo no se contradigan: 2 en ruta, 2 llegados sin liquidar, 3 cerrados. */
  var VIAJES = [
    {estado:"EN_TRANSITO", carga:"CARGADO", guia:""},                                  /* V2K-885 */
    {estado:"EN_TRANSITO", carga:"VACIO",   guia:""},                                  /* W7J-712 */
    {estado:"LLEGO",   carga:"CARGADO", guia:"",              fechaFin:"2026-07-25"},  /* X3M-401 */
    {estado:"LLEGO",   carga:"CARGADO", guia:"T003-0009812",  fechaFin:"2026-07-27"},  /* Y8P-233 */
    {estado:"CERRADO", carga:"CARGADO", guia:"T003-0009790",  fechaFin:"2026-07-18", cerrado:true},
    {estado:"CERRADO", carga:"CARGADO", guia:"T003-0009771",  fechaFin:"2026-07-14", cerrado:true},
    {estado:"CERRADO", carga:"VACIO",   guia:"",              fechaFin:"2026-07-09", cerrado:true}
  ];
  g.TRAZZA.db = {
    listar: function(o){ return P(o && o.coleccion==="viajes" ? VIAJES : []); },
    guardar:function(){ return P(); },
    borrar: function(){ return P(); }
  };
})(window);
</script>
<script src="../public/core/trazza-catalogo.js"></script>

<script>
/* ==========================================================================
   PORTAL — lógica
   --------------------------------------------------------------------------
   Tres responsabilidades y nada más:
     1) resolver quién entró (TRAZZA.requireLogin) y pintar su nombre;
     2) pedir al catálogo QUÉ MÓDULOS le tocan y agruparlos para leerlos;
     3) contar cuatro cosas de la operación de hoy para que la primera
        pantalla diga algo, en vez de ser un cajón de iconos.

   El punto 3 es el que decide si un portal se usa o se saltea. Un portal que
   solo lista módulos se convierte en una pantalla por la que se pasa sin
   mirar; la gente termina guardando el enlace del módulo en favoritos. Un
   portal que dice "hay 4 viajes sin liquidar y 3 guías sin subir" es el
   lugar donde se empieza el día. Los conteos son enlaces: cada número lleva
   al módulo filtrado por ese número, nunca a una lista genérica.
   ========================================================================== */
(function(){
  "use strict";
  var $  = function(id){ return document.getElementById(id); };
  var esc= function(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); };
  var n  = function(v){ var x=parseFloat(v); return isFinite(x)?x:0; };

  var CFG = window.TRAZZA_CONFIG || {};
  var PERFIL = null, MODULOS = [], PLANOS = [], SEL = 0;

  // Iconos por área. Viven aquí y no en la config del cliente a propósito:
  // un tenant no debería tener que elegir emojis para estrenar el producto,
  // y un área sin icono cae en el genérico sin romper nada.
  var ICO = {
    miespacio:"◉", operaciones:"🚚", mantenimiento:"🔧", maestros:"🗂",
    rrhh:"👷", contabilidad:"🧾", ssoma:"🦺", planificacion:"🗓",
    comercial:"🤝", presupuesto:"📊", administracion:"⚙", _:"▪"
  };
  var ICOMOD = {
    /* mi espacio */
    misdatos:"👤", mistareas:"✓", misboletas:"🧾", micts:"🏦", miroster:"📆", misvacaciones:"🌴",
    /* operaciones */
    programacion:"🗓", viajes:"🧭", seguimiento:"📡", roster:"📆", gasto:"➕",
    combustible:"⛽", gnl:"⛽", lavado:"💧", documentos:"📎",
    /* mantenimiento */
    estatus:"🚨", ordenes:"📋", neumaticos:"◎", preventivo:"🔧", entregables:"📤",
    /* maestros */
    unidades:"🚛", personal:"👥", rutas:"🛣", talleres:"🏭",
    /* rrhh */
    asistencia:"⏱", legajos:"🗃", boletas:"🧾", cts:"🏦",
    /* contabilidad */
    viaticos:"💵", guias:"📄", cobrar:"💳", contabilidad:"📒",
    /* ssoma */
    epp:"🦺", gastosSsoma:"🧯", ssoma:"🛡",
    /* planificación / comercial / presupuesto */
    plan:"🗓", comercial:"🤝", presupuesto:"📊",
    /* administración */
    tablero:"📈", utilidad:"📈", accesos:"🔑", enlaces:"🔗", alertas:"⏳",
    solicitudes:"📨", tareas:"✓", consistencia:"🔎", respaldo:"💾",
    _:"▪"
  };
  /* Iconos por rubro: la tarjeta colapsada usa el del rubro, no el del
     primer hermano. Un rubro que se pinta con el icono de uno de sus
     miembros hace creer que la tarjeta ES ese miembro. */
  var ICORUBRO = { gastos:"⛽", taller:"🔧", personas:"👷", _:"▪" };

  function razonSocial(){
    var r=(CFG.marca&&CFG.marca.razonSocial)||"";
    return (!r || r==="REEMPLAZAR") ? "" : r;
  }

  function areaLabel(id){
    var a=(CFG.areas||{})[id];
    if(!a) return id;
    return a.padre ? (a.padre+" · "+a.label) : a.label;
  }

  /* ---------- reloj ---------- */
  function reloj(){
    var d=new Date();
    var h=d.getHours(), m=d.getMinutes();
    var ampm = h>=12 ? "p. m." : "a. m.";
    var h12 = h%12; if(h12===0) h12=12;
    $("hora").textContent = h12+":"+(m<10?"0":"")+m+" "+ampm;
    var f = d.toLocaleDateString("es-PE",{weekday:"long",day:"numeric",month:"long"});
    // Solo la primera letra. text-transform:capitalize daba "Viernes, 31 De Julio":
    // en español el mes y la preposición van en minúscula.
    $("fecha").textContent = f.charAt(0).toUpperCase()+f.slice(1);
  }

  function saludoDe(){
    var h=new Date().getHours();
    if(h<12) return "Buenos días";
    if(h<19) return "Buenas tardes";
    return "Buenas noches";
  }
  function primerNombre(s){
    s=String(s||"").trim(); if(!s) return "";
    return s.split(/\s+/)[0];
  }
  function iniciales(s){
    var p=String(s||"").trim().split(/\s+/).filter(Boolean);
    if(!p.length) return "·";
    return (p[0][0]+(p[1]?p[1][0]:"")).toUpperCase();
  }

  /* ---------- catálogo -> grupos ---------- */
  // El catálogo devuelve una lista plana ya filtrada por contrato y permiso.
  // Agrupar por área es cosa de la vista, no del motor: otro tenant podría
  // querer agrupar por rubro o no agrupar. Por eso se hace aquí.
  function agrupar(lista){
    var orden=[], bolsa={};
    lista.forEach(function(m){
      var k=m.area||"_";
      if(!bolsa[k]){ bolsa[k]={id:k,label:areaLabel(k),icono:ICO[k]||ICO._,mods:[]}; orden.push(k); }
      bolsa[k].mods.push(m);
    });
    // El orden de los grupos lo manda `orden` en la config del tenant, no el
    // orden en que aparecieron los módulos en el array. Un área sin `orden`
    // se va al final, en el orden en que apareció: nunca desaparece.
    var A=CFG.areas||{};
    orden.sort(function(a,b){
      var oa=(A[a]&&A[a].orden)||999, ob=(A[b]&&A[b].orden)||999;
      if(oa!==ob) return oa-ob;
      return 0;
    });
    return orden.map(function(k){ return colapsarRubros(bolsa[k]); });
  }

  // Punto 4 del changelog, en la vista. Los módulos que comparten `rubro` se
  // pintan como UNA tarjeta —la del rubro— con los hermanos como chips. No se
  // fusiona nada: la tarjeta entra al primero, y cada hermano sigue siendo su
  // propia página. Tres tarjetas casi idénticas (Combustible, GNL, Lavado)
  // ocupan media rejilla y no dicen nada que "Reporte de gastos" no diga.
  // Un rubro con un solo módulo visible NO se colapsa: sería una pestaña sola.
  function colapsarRubros(g){
    var defs={}, lista=(CFG.rubros||[]);
    lista.forEach(function(r){ defs[r.id]=r; });
    var cuenta={};
    g.mods.forEach(function(m){ if(m.rubro) cuenta[m.rubro]=(cuenta[m.rubro]||0)+1; });
    var out=[], hecho={};
    g.mods.forEach(function(m){
      if(!m.rubro || cuenta[m.rubro]<2){ out.push(m); return; }
      if(hecho[m.rubro]) return;
      hecho[m.rubro]=1;
      var r=defs[m.rubro]||{}, hermanos=g.mods.filter(function(x){ return x.rubro===m.rubro; });
      out.push({
        id:"rubro_"+m.rubro, label:r.label||m.rubro, area:g.id,
        url:hermanos[0].url, estado:"activo",
        desc:r.desc||hermanos.map(function(x){return x.label;}).join(" · "),
        _icono:ICORUBRO[m.rubro]||r.icono||ICORUBRO._,
        _chips:hermanos.map(function(x){ return x.label; })
      });
    });
    return { id:g.id, label:g.label, icono:g.icono, mods:out };
  }

  function tarjeta(m){
    var pronto = (m.estado==="proximamente");
    var ico = m._icono || ICOMOD[m.id] || ICOMOD._;
    var sello = m._sello ? '<span class="sello '+(m._selloClase||"")+'">'+esc(m._sello)+'</span>' : "";
    var chips = (m._chips&&m._chips.length)
      ? '<div class="chips">'+m._chips.map(function(c){ return '<span>'+esc(c)+'</span>'; }).join("")+'</div>'
      : "";
    return ''+
      '<article class="mod'+(pronto?" pronto":"")+'" data-url="'+esc(pronto?"":m.url)+'">'+
        sello+
        '<div class="mi">'+ico+'</div>'+
        '<h3>'+esc(m.label)+'</h3>'+
        '<p>'+esc(m.desc||"")+'</p>'+
        chips+
        '<div class="ir">'+(pronto?'Próximamente':'Abrir <i>›</i>')+'</div>'+
      '</article>';
  }

  function pintarGrupos(){
    var gs=agrupar(MODULOS);
    $("grupos").innerHTML = gs.map(function(g){
      return ''+
      '<section class="grupo">'+
        '<div class="gtit"><div class="gi">'+g.icono+'</div><h2>'+esc(g.label)+'</h2>'+
        '<span class="n">'+g.mods.length+(g.mods.length===1?" módulo":" módulos")+'</span></div>'+
        '<div class="rejilla">'+g.mods.map(tarjeta).join("")+'</div>'+
      '</section>';
    }).join("");

    // Riel: un salto por grupo, no un enlace por módulo. Treinta enlaces en
    // una columna es un índice, no una navegación.
    $("rlista").innerHTML = '<div class="ritem on" data-ir="top"><span class="ico">⌂</span><span class="txt">Inicio</span></div><div class="rsep"></div>'+
      gs.map(function(g,i){
        return '<div class="ritem" data-ir="g'+i+'"><span class="ico">'+g.icono+'</span><span class="txt">'+esc(g.label)+'</span><span class="cnt">'+g.mods.length+'</span></div>';
      }).join("");

    var secs=document.querySelectorAll("#grupos .grupo");
    $("rlista").addEventListener("click",function(e){
      var it=e.target.closest(".ritem"); if(!it) return;
      var d=it.getAttribute("data-ir");
      document.querySelectorAll(".ritem").forEach(function(x){ x.classList.remove("on"); });
      it.classList.add("on");
      $("riel").classList.remove("abierto");
      if(d==="top"){ window.scrollTo({top:0,behavior:"smooth"}); return; }
      var s=secs[parseInt(d.slice(1),10)];
      if(s) window.scrollTo({top:s.getBoundingClientRect().top+window.scrollY-84,behavior:"smooth"});
    });

    $("grupos").addEventListener("click",function(e){
      var c=e.target.closest(".mod"); if(!c) return;
      var u=c.getAttribute("data-url"); if(u) location.href=u;
    });
  }

  /* ---------- pulso: cuatro cifras de HOY ---------- */
  // Cada cifra es una pregunta que alguien hace en voz alta todos los días.
  // Si una consulta falla, la tarjeta se pinta en gris con un guion: un
  // portal que no carga porque un contador se cayó es peor que un portal
  // con un dato menos.
  function pintarPulso(d){
    var t=[
      {n:d.enRuta,       l:"unidades en ruta ahora",     p:"tramos abiertos sin marcar llegada", cls:d.enRuta>0?"":"bien",        url:"operaciones/viajes/"},
      {n:d.sinLiquidar,  l:"viajes por liquidar",        p:"llegaron y siguen sin cerrar",       cls:d.sinLiquidar>0?"tibio":"bien", url:"operaciones/viajes/"},
      {n:d.sinGuia,      l:"tramos cargados sin guía",   p:"no se pueden cerrar ni facturar",    cls:d.sinGuia>0?"alerta":"bien", url:"operaciones/viajes/"},
      {n:d.vencen,       l:"vencimientos en 7 días",     p:"documentos y mantenimiento",         cls:d.vencen>0?"alerta":"bien",  url:"contabilidad/documentos/"}
    ];
    $("pulso").innerHTML=t.map(function(x){
      return '<div class="kpi '+x.cls+'" data-url="'+esc(x.url)+'">'+
        '<div class="n">'+(x.n==null?"—":x.n)+'</div>'+
        '<div class="l">'+esc(x.l)+'</div>'+
        '<div class="p">'+esc(x.p)+'</div></div>';
    }).join("");
    $("pulso").addEventListener("click",function(e){
      var k=e.target.closest(".kpi"); if(!k) return;
      var u=k.getAttribute("data-url"); if(u) location.href=u;
    });
  }

  function contar(){
    var vacio={enRuta:null,sinLiquidar:null,sinGuia:null,vencen:null};
    if(!(window.TRAZZA&&TRAZZA.db&&TRAZZA.db.listar)) return Promise.resolve(vacio);
    return TRAZZA.db.listar({coleccion:"viajes"}).then(function(vs){
      var enRuta=0,sinLiq=0,sinGuia=0;
      (vs||[]).forEach(function(v){
        var cerrado = v.estado==="CERRADO" || !!v.cerrado;
        var llego   = !!v.fechaFin || v.estado==="LLEGO";
        if(!cerrado && !llego) enRuta++;
        if(!cerrado && llego)  sinLiq++;
        if(!cerrado && v.carga==="CARGADO" && !v.guia) sinGuia++;
      });
      return {enRuta:enRuta,sinLiquidar:sinLiq,sinGuia:sinGuia,vencen:null};
    }).catch(function(){ return vacio; });
  }

  /* ---------- paleta de comandos ---------- */
  function abrirPaleta(){
    $("velo").classList.remove("hidden");
    $("q").value=""; SEL=0; filtrar("");
    setTimeout(function(){ $("q").focus(); },10);
  }
  function cerrarPaleta(){ $("velo").classList.add("hidden"); }

  function filtrar(t){
    t=String(t||"").trim().toLowerCase();
    var l=PLANOS.filter(function(m){
      if(!t) return true;
      return (m.label+" "+(m.desc||"")+" "+m._grupo).toLowerCase().indexOf(t)>=0;
    });
    if(SEL>=l.length) SEL=Math.max(0,l.length-1);
    $("pres").innerHTML = l.length ? l.map(function(m,i){
      return '<div class="it'+(i===SEL?" sel":"")+'" data-url="'+esc(m.estado==="proximamente"?"":m.url)+'" data-i="'+i+'">'+
        '<div class="ii">'+(ICOMOD[m.id]||ICOMOD._)+'</div>'+
        '<div><b>'+esc(m.label)+'</b><small>'+esc(m.desc||"")+'</small></div>'+
        '<div class="ar">'+esc(m._grupo)+'</div></div>';
    }).join("") : '<div class="nada">Nada coincide con «'+esc(t)+'».</div>';
    $("pres")._lista=l;
  }

  function moverSel(d){
    var l=$("pres")._lista||[]; if(!l.length) return;
    SEL=(SEL+d+l.length)%l.length;
    filtrar($("q").value);
    var el=$("pres").querySelector(".it.sel"); if(el) el.scrollIntoView({block:"nearest"});
  }
  function abrirSel(){
    var l=$("pres")._lista||[]; var m=l[SEL]; if(!m) return;
    if(m.estado==="proximamente") return;
    location.href=m.url;
  }

  /* ---------- arranque ---------- */
  function arrancar(sesion){
    PERFIL = sesion.perfil||{};
    var nom = PERFIL.nombre || sesion.user.email || "";
    $("saludo").textContent = saludoDe()+(primerNombre(nom)?(", "+primerNombre(nom)):"")+" 👋";
    // La razón social sale de la config del tenant y de ningún otro lado. Si
    // todavía dice REEMPLAZAR —o está vacía— no se pinta un placeholder en la
    // cara del usuario: se pinta solo "Portal de gestión". Un producto que
    // muestra sus propios placeholders parece a medio hacer, y el que lo ve
    // primero suele ser el que decide si se compra.
    $("etiqueta").textContent = "Portal de gestión"+(razonSocial()?" · "+razonSocial():"");
  // La bajada se arma aquí y no en el HTML porque depende del dispositivo:
  // prometer "el riel de la izquierda" y "Ctrl K" en un teléfono, donde no
  // existe ninguno de los dos, es una instrucción que no se puede seguir.
  var conTeclado = window.matchMedia && window.matchMedia("(min-width:821px)").matches;
  $("bajada").innerHTML = conTeclado
    ? 'Entra a cualquier módulo desde aquí, salta de grupo con el riel de la izquierda, o búscalo por nombre con <b>Ctrl&nbsp;K</b>.'
    : 'Entra a cualquier módulo desde aquí, o toca <b>☰</b> para saltar de grupo.';
    $("rz").textContent = razonSocial() || (CFG.marca&&CFG.marca.nombre) || "Trazza";
    $("qn").textContent = nom;
    $("qr").textContent = (TRAZZA.esAdmin&&TRAZZA.esAdmin(PERFIL)) ? "Administrador" : (PERFIL.tipo||"Usuario");
    $("av").textContent = iniciales(nom);

    MODULOS = (window.TRAZZA.catalogo && TRAZZA.catalogo.modulos) ? TRAZZA.catalogo.modulos() : [];
    PLANOS = MODULOS.map(function(m){ var c={}; for(var k in m) c[k]=m[k]; c._grupo=areaLabel(m.area); return c; });

    pintarGrupos();
    pintarPulso({enRuta:null,sinLiquidar:null,sinGuia:null,vencen:null});
    $("cargando").classList.add("hidden");
    $("portal").classList.remove("hidden");
    contar().then(pintarPulso);
  }

  reloj(); setInterval(reloj,20000);

  $("abrirBuscar").addEventListener("click",abrirPaleta);
  $("menu").addEventListener("click",function(){ $("riel").classList.toggle("abierto"); });
  $("salir").addEventListener("click",function(){ if(window.TRAZZA&&TRAZZA.logout) TRAZZA.logout(); });
  $("velo").addEventListener("click",function(e){ if(e.target===$("velo")) cerrarPaleta(); });
  $("q").addEventListener("input",function(){ SEL=0; filtrar(this.value); });
  $("pres").addEventListener("click",function(e){
    var it=e.target.closest(".it"); if(!it) return;
    var u=it.getAttribute("data-url"); if(u) location.href=u;
  });
  document.addEventListener("keydown",function(e){
    var enCampo = /^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName||""));
    if((e.key==="k"||e.key==="K") && (e.ctrlKey||e.metaKey)){ e.preventDefault(); abrirPaleta(); return; }
    if(e.key==="/" && !enCampo){ e.preventDefault(); abrirPaleta(); return; }
    if($("velo").classList.contains("hidden")) return;
    if(e.key==="Escape"){ cerrarPaleta(); }
    else if(e.key==="ArrowDown"){ e.preventDefault(); moverSel(1); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); moverSel(-1); }
    else if(e.key==="Enter"){ e.preventDefault(); abrirSel(); }
  });

  if(window.TRAZZA && TRAZZA.requireLogin){
    TRAZZA.requireLogin().then(arrancar);
  }else{
    $("cargando").innerHTML='<div class="aviso">No se pudo cargar el núcleo de Trazza. Revisa el orden de los &lt;script&gt; en esta página.</div>';
  }
})();
</script>
</body>
</html>
